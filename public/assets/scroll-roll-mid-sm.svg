<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="100%" height="26">
<defs><pattern id="t" width="320" height="48" patternUnits="userSpaceOnUse" patternTransform="scale(0.5416666666666666)"><svg width="320" height="48" viewBox="0 0 320 48">
